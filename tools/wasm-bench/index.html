<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ocarina Forge wasm bench</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 15px/1.45 system-ui, sans-serif; margin: 2rem; max-width: 960px; background: #111; color: #eee; }
    h1 { font-size: 1.4rem; font-weight: 600; }
    p, li { color: #ccc; }
    #isolated { padding: 0.6rem 0.8rem; border-radius: 6px; margin: 1rem 0; }
    #isolated.ok { background: #14331c; color: #b6f0c4; }
    #isolated.warn { background: #3a2210; color: #ffd19a; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border-bottom: 1px solid #333; text-align: left; padding: 0.45rem 0.5rem; }
    th { color: #9ad; font-weight: 600; }
    #status { font-weight: 600; }
    pre { background: #1b1b1b; padding: 1rem; overflow: auto; font-size: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Ocarina Forge wasm bench</h1>
  <p>Walkable-surface sampling (the Snap / height-diff path) and texture decode, running in this tab.</p>
  <p id="isolated">Checking isolation…</p>
  <p id="status">Starting…</p>
  <table id="results">
    <thead>
      <tr>
        <th>Path</th>
        <th>ms</th>
        <th>points/s</th>
        <th>max |error|</th>
        <th>notes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <h2>Log</h2>
  <pre id="log"></pre>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

# Post-game boot hook.
#
# The gate (milestone M2a) is unchanged:
#
#   Ganon count greater than 0?  (int case 2; cases 0 and 1 rejoin)
#     no  -> original event
#     yes -> TitleEventBase is false?  (bool case 1; case 0 is true)
#              no  -> set Navi_Ban, then the original event
#              yes -> set HavePlayedEvent.TitleEventBase = true
#                     Defeat_Ganon already at Step09? (BoolExp case 0 is true)
#                       yes -> continue, and skip the Complete step
#                       no  -> ChallengeSystemActor marks Defeat_Ganon Complete
#                              (IsIgnoreChallengeProgressUI true), then continue
#
# Measured on a cleared save. Rupees 218 -> 259 (+41 = 1 + 8 + 32) while the
# flag was 0: int case 2 and bool case 1. Rupees 259 -> 284 (+25 = 1 + 8 + 16)
# after the flag was set: int case 2 and bool case 0. So an int query against
# Value is case 0 less, case 1 equal, case 2 greater, and a bool query is
# case 0 true, case 1 false.
#
# epilogue: true is the era switch (M2b). After the flag is set, the flow calls
# (self)::AtO_OrigBoot, which is the event this entry point used to start at,
# and then runs `chain`. A cleared save that already has the flag sets Navi_Ban,
# swaps the ocarina, and then runs the original event. Ganon cases 0 and 1 still
# go straight there.
# epilogue: false is the M2a gate only: set the flag and rejoin.
# debug_cases and debug_visible also skip the era switch, so a diagnostic
# reload does not change the scene and does not re-ban Navi.
#
# custom_wake: true (stage 2) boots AtO_Epilogue_Wake. That entry is built from
# LinkSleepInBed's BedBootEvent: Navi_Ban first, then the bed camera and the
# stretch / fade fork, with no Navi warp. custom_wake: false boots
# BedBootEvent_Alive and sets Navi_Ban before the banc change.
#
# wake_dialogue shows SystemTextNPC.EventTalk (AtO_WakeLine) before the camera
# is given back. The Spiritual Stones and the six Sage Medallions leave the
# pouch next, then the ocarina swap, still before the autosave. A later load
# runs the same removal before the ocarina swap. Removing one of those items
# on that load shares the ocarina autosave. After
# the EquipOcarina write it recreates Link's equipment, then autosave sends
# EventCamera's keep-state message and calls
# GameSystemActor.EventTriggerRequestAutoSave. That save is the last event.
# OpeningEvent, Saria's Event32, and ForestTemple_Gimmick Event326 end the same
# way, with no caption after the save. Either flag can be set false.
#
# chain order is the one read off the dump. ReplaceEquipmentForEraChange runs
# before Sequence_IsChildhood, because that subflow reads the era Link is in.
# NextPosition and NextStartRot are three floats. evfl stores a float3 as a
# float array; it has no vec3 type. EventStarterName is an empty string.
#
# debug_cases and debug_visible stay available and are off. debug_cases adds
# 1, then 2/4/8, then 16/32, and tools/decode_cases.py names the path. It
# replaces debug_visible. Neither one ships.
#
# The clear count is DefeatedEnemyNum.Enemy_DungeonBoss_Ganon (Int, 0 before
# a clear and 1 after). The epilogue flag is HavePlayedEvent.TitleEventBase.
# A node that does not continue breaks every load. Back up user/save first.
#
# entry_point is optional. Leave it unset to hook the first entry point evfl
# reports. The build prints the full list; set entry_point to one of those
# names if the load entry is not the first.
patches:
  - file: Event/EventFlow/DefaultBootEvent.bfevfl.zs
    ganon_cleared_cases: [2]
    bool_false_case: 1
    epilogue: true
    custom_wake: true
    # Narration after the camera returns. Set false to drop the line.
    wake_dialogue: true
    # Keep-state, then GameSystemActor.EventTriggerRequestAutoSave, then the flow ends.
    autosave: true
    # Off: Npc_Dream's recreate (wait 1 frame, sync the pouch, wait for the equipment).
    # On: LinkSleepInBed's delete-then-wait instead. Leave this false.
    ocarina_delete_equipment: false
    boot_event: AtO_Epilogue_Wake
    vanilla_boot_event: BedBootEvent_Alive
    orig_entry: AtO_OrigBoot
    steps:
      - name: AtO_CheckGanon
        call: EventQueryIsGameDataInt
        # Case 2 is greater than Value. ganon_cleared_cases is the list that continues.
        continue_case: 2
        params:
          GameDataName: DefeatedEnemyNum.Enemy_DungeonBoss_Ganon
          Value: 0
          Index: -1
      - name: AtO_CheckEpilogue
        call: EventQueryIsGameDataBool
        # Case 1 is false. Case 0 is true. bool_false_case overrides continue_case.
        continue_case: 1
        params:
          GameDataName: HavePlayedEvent.TitleEventBase
          Index: -1
      - name: AtO_SetEpilogue
        call: EventTriggerSetGameDataBool
        params:
          GameDataName: HavePlayedEvent.TitleEventBase
          Index: -1
          Value: true
      # First epilogue load only: this still sits in front of the era switch.
      # Case 0 (already Step09 or Complete) skips the step and joins the same event.
      - name: AtO_GanonGuard
        call: EventQueryIsGameDataBoolExp
        continue_case: 1
        params:
          GameDataName: Defeat_Ganon_IsAfter_Step09_Exp
      - name: AtO_GanonComplete
        actor: ChallengeSystemActor
        call: EventExecuteProgressChallengeStep
        params:
          ChallengeName: Defeat_Ganon
          StepName: Complete
          IsWaitEnd: true
          IsIgnoreCompletedChallenge: false
          IsIgnoreChallengeProgressUI: true
    chain:
      - name: AtO_Participate
        actor: Player_Event
        call: EventTriggerParticipateEvent
      - name: AtO_ReplaceGear
        subflow: ReplaceEquipmentForEraChange
        entry: ReplaceEquipmentForEraChange
      - name: AtO_MakeChild
        actor: GameDataActor
        call: EventTriggerSetGameDataBool
        params:
          GameDataName: Sequence_IsChildhood
          Index: -1
          Value: true
      - name: AtO_Morning
        actor: EventWorldManagerController
        call: EventTrigger_SetTime
        params:
          TimeMin: 0
          TimeHour: 6
      - name: AtO_SunSong
        actor: SoundSystemActor
        call: EventTriggerSoundSetSunSongInfo
        params:
          NextTimeDivision: 0
      - name: AtO_PreloadForest
        actor: GameSystemActor
        call: EventTriggerBancRequestBeforehandLoad
        params:
          BancPath: Work/Banc/Scene/KokiriForest/KokiriForest_Child.bcett.json
          IsTargetRetry: false
      - name: AtO_BancChange
        actor: GameSystemActor
        call: EventReserveBancChange
        params:
          IsWaitEnd: true
          IsStartOnEvent: false
          NextBanc: KokiriForest_Child
          NextStartPos: ReturnFromDreamWorld
          NextPosition: [0.0, 0.0, 0.0]
          NextStartRot: [0.0, 0.0, 0.0]
          FadePattern: 2
          BootEventName: AtO_Epilogue_Wake
          EventStarterName: ""
          IsItemWarp: false
      - name: AtO_LookForward
        actor: Player_Event
        call: EventTriggerPlayerRequestLookAtTheFrontLock
        params:
          IsImmediate: true

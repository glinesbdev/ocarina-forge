# Saria's Song on the epilogue.
#
# Free play reaches Dm_SY_Ocarina_SariaSong::SariaSong from Event100, and
# that subflow is the whole telepathy. Event26 looks at the player and its
# nxt is Event155, the child query that leads to the hint lines. This patch
# leaves SariaSong on Event125. Event26's nxt moves to a GameDataActor query
# on HavePlayedEvent.TitleEventBase. Case 0 plays AtO_SariaSongLine, copied
# from Event19, then fades the telepathy sparkle the way Event122 does, and
# ends. Case 1 continues to Event155. Dm_SY_Ocarina.bfevfl is not edited.
patches:
  - file: Event/EventFlow/Dm_SY_Ocarina_SariaSong.bfevfl.zs
    song_gate: true
    from_event: Event26
    rejoin_event: Event155
    talk_source: Event19
    fade_source: Event122
    message_id: EventFlowMsg/Dm_SY_Ocarina:AtO_SariaSongLine

# Child Zelda's courtyard presence.
#
# Npc_Hylia_Zelda_Child is banc actor 190. Her Presence is
# DoorOfTime_IsAfter_Step2_2_Exp, negated, so she is absent on a cleared
# save. Logic cannot override that. The BoolExp entry is hash 713412248
# and its expression is Values, not RPN. The build appends AND NOT
# HavePlayedEvent.TitleEventBase after some expression already contains
# [0, hash], [5], [3]. flag_hash is murmur3 of the flag name.
#
# Dm_SY_Ocarina_SariaSong (Event13 and Event66) also reads this expression.
# On current main, playing Saria's Song beside the sitting Saria still
# runs the Sacred Grove telepathy. After this change, that same play is
# the check for whether the song flow took the pre-Step2_2 branch.
expressions:
  - file: GameData/GameDataList.Product.110.byml.zs
    name: DoorOfTime_IsAfter_Step2_2_Exp
    flag: HavePlayedEvent.TitleEventBase
    flag_hash: 3647319961

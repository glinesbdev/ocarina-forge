# Courtyard actors to remove once HavePlayedEvent.TitleEventBase is set.
#
# The guard is banc actor 223. His Presence is not negated, Logic_Create
# is constant true, and Logic_Delete is unwired.
#
# The closed steel gate is banc entry 283, Land_HrlCastle_..._Door_Steel_A_1f92,
# in Logic/HyruleCastle_Prefab_c03d. It has no Presence. Logic_Create reads
# the step OR's True output (at or after DoorOfTime Step03) and Logic_Delete
# is unwired, so the gate stays shut. The open gate, banc entry 284
# (..._d73e, rotated 90 degrees), is the same module: Create reads that OR's
# False output and Delete reads its True output. open rewires d73e so a
# false flag still matches those two outputs.
#
# place stays false. The banc is not edited. Zelda's Presence is negated,
# so she is not handled here.
place: false
flag: HavePlayedEvent.TitleEventBase
deletes:
  - logic: Logic/HyruleCastle_Prefab_6d27.logic.module.ainb
    instance: Npc_Hylia_Soldier_027_Child
  - logic: Logic/HyruleCastle_Prefab_c03d.logic.module.ainb
    instance: Land_HrlCastle_HyruleCastle_A_Door_Steel_A_1f92
    open: Land_HrlCastle_HyruleCastle_A_Door_Steel_A_d73e

# The boot-event row for the epilogue wake.
#
# The file is not named here. The build searches every *.rstbl.byml.zs for a
# row __RowId BedBootEvent_Alive and clones it. Zero matches, or more than one,
# fail the build. FlowchartFileName and EntryPointName have to already be keys
# on that row; every other key (player position, the NPC list, the sound flag)
# is copied as it is.
edits:
  - find_row: BedBootEvent_Alive
    row: AtO_Epilogue_Wake
    set:
      FlowchartFileName: Work/Event/EventFlow/DefaultBootEvent.evfc
      EntryPointName: AtO_Wake

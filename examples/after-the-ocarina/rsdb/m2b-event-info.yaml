# Subflows DefaultBootEvent is allowed to call.
#
# The 1.1.1 row DefaultBootEvent lists SubFlowList: [Common]. The era switch
# also calls ReplaceEquipmentForEraChange, which the Temple of Time rows already
# list. Rows stay sorted by __RowId. Adding a name that is already present
# does nothing.
edits:
  - file: RSDB/GameAnalyzedEventInfo.Product.111.rstbl.byml.zs
    row: DefaultBootEvent
    subflows:
      - ReplaceEquipmentForEraChange
  # Cloned after the subflow list is updated, so the wake row can call the same flows.
  # IsPlayerWarpFirstFrame has to already be on the DefaultBootEvent row.
  - file: RSDB/GameAnalyzedEventInfo.Product.111.rstbl.byml.zs
    clone: DefaultBootEvent
    row: AtO_Epilogue_Wake
    set:
      IsPlayerWarpFirstFrame: true

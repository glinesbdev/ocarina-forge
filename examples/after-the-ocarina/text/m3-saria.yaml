# Epilogue lines. create: true adds the label. Dm_Kokiri_0060_0002 stays the
# M1 line, so a new game still hears that sentence.
#
# AtO_WakeLine plays only from AtO_Epilogue_Wake, and only when wake_dialogue
# is true. AtO_SariaLine plays from Npc_EventStarter.EventTalk once
# HavePlayedEvent.TitleEventBase is already true. A new game leaves that flag
# false and never reaches it.
#
# Five pages, split with {0:4:}. A visible line stays at 52 characters,
# and a page stays at three lines. Page 1 is 51. Page 2 is 52, so it keeps
# the line break after "went." Page 3's second sentence is 53, so "forever"
# starts its own line. Page 5's first sentence is 55, so "for you" starts
# its own line. Page 4 already fits. The emotion and animation tags were
# supplied from her vanilla lines. This checkout has no dump, so they were
# not re-checked here. Page 3 uses {3:0:140000}, the same emotion as the
# Navi page. No other concerned id was available to compare.
# The Lost Woods warning hints at the Majora's Mask opening and the Stalfos
# lore, and it leaves both unstated. It does not name another race.
edits:
  - pack: Mals/USen.Product.110.sarc.zs
    msbt: EventFlowMsg/Dm_Kokiri_0060.msbt
    label: AtO_WakeLine
    create: true
    note: Narration before the camera returns. wake_dialogue in the boot yaml turns it on.
    text: "Navi is gone. The forest is quiet, and Link has been asleep a long time."
  - pack: Mals/USen.Product.110.sarc.zs
    msbt: EventFlowMsg/Npc_Kokiri_Saria_Child.msbt
    label: AtO_SariaLine
    create: true
    note: Saria, by the house, once the epilogue flag is set.
    text: "{3:0:0f0100}{4:0:0b004772656574696e675f303000}Link! You're awake...{5:1:} I stayed close to your house,\\njust in case you needed me.{0:4:}{3:0:140000}And Navi... she's gone.{5:1:} I don't know where she went.\\nShe didn't even say goodbye.{0:4:}{3:0:140000}Just... be careful in the Lost Woods, OK?{5:1:}\\nWithout a fairy, you could get lost\\nin there forever.{0:4:}{3:0:000000}There's a whole world past the forest, you know.{5:1:}\\nI bet lots of people out there could use a friend\\nlike you!{0:4:}{3:0:010100}{4:0:06004c617567685300}Even if Navi's gone, we Kokiri are always here\\nfor you.\\nWe'll always be friends, 'K?"

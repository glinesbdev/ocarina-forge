name: godot-spike

on:
  pull_request:
    paths:
      - "godot/**"
      - "docs/godot-spike.md"
      - "docs/godot-project.md"
      - "docs/formats.md"
      - ".github/workflows/godot-spike.yml"
  push:
    branches:
      - godot-spike
      - godot-project-gen

jobs:
  importers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Importer tests
        run: dotnet test godot/Forge.Import.Tests/Forge.Import.Tests.csproj --nologo
      - name: Project planner tests
        run: dotnet test godot/Forge.Project.Tests/Forge.Project.Tests.csproj --nologo --filter "FullyQualifiedName~ProjectPlanTests.Synthetic|FullyQualifiedName~ProjectPlanTests.Unchanged|FullyQualifiedName~ProjectPlanTests.Safe"
      - name: Viewer build
        run: dotnet build godot/viewer/OcarinaForge.Viewer.csproj -c Debug --nologo
      - name: Godot 4.7.2 headless self-test and project generator
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT=/tmp/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          chmod +x "$GODOT"
          "$GODOT" --headless --path godot/viewer -- --self-test
          GODOT="$GODOT" REQUIRE_GODOT=1 dotnet test godot/Forge.Project.Tests/Forge.Project.Tests.csproj --nologo --filter "FullyQualifiedName~HeadlessGenerate"

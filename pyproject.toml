[project]
name = "bancwright"
version = "0.1.0"
description = "Visual modding workbench for the Ocarina of Time remake on Longshot."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pyyaml>=6",
  "zstandard>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bancwright*"]

[project]
name = "bancwright"
version = "0.1.0"
description = "Visual modding workbench for the Ocarina of Time remake on Longshot."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "PyYAML==6.0.2",
  "ruamel.yaml==0.18.16",
  "zstandard==0.23.0",
  "texture2ddecoder==1.0.5",
  "httpx>=0.27",
  "evfl==1.3.0",
  "ainb==0.2.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bancwright*"]

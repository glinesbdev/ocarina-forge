[package]
name = "ocarina-forge-native"
version = "0.1.0"
edition = "2021"
description = "Hot pixel paths for Ocarina Forge. Bytes in, bytes out, no Python types."
license = "MIT"
publish = false

[lib]
name = "ocarina_forge_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# PyO3 stays behind this feature so `cargo build --no-default-features
# --target wasm32-unknown-unknown` can compile the encoder alone.
python = ["dep:pyo3"]
# Browser bindings for the surface sampler and texture decode. Used by
# `wasm-pack build --no-default-features --features wasm`.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
bcdec_rs = "0.2"
astc-decode = "0.3"
pyo3 = { version = "0.23.5", features = ["extension-module", "abi3-py311"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
